  - name: 来自开发者的消息
    tagline:
    date: "2025年2月16日"
    message: |
      我担任Brio的开发者及维护者已经超过一年了。

      感谢每一位使用Brio、慷慨捐助、贡献代码、提出建议、报告错误或只是参与社区的人。
      过去这一年能与如此多美好灵魂相遇，我满怀感激。

      这三百多个日夜是我生命中最艰难的旅程。但正是因为你们的存在，因为Brio的存在，
      漫漫长夜才不至完全吞噬光明。请再次接受我最诚挚的谢意。

      而在浩瀚星海中，有一颗星辰我要特别诉说：

      当问及你天际的色彩时，我原以为会得到某个简单的答案，
      却意外窥见了整片绚丽的苍穹——那令我沉醉其中、无法自拔的绚丽色彩，
      是想要永远镌刻在灵魂深处的绝色。

      曾许诺赠你繁星皓月，许你指引灵魂的微光，誓言永不离去，
      此刻这些诺言比任何时刻都更加坚定。

      或许这并非我完全有资格赠予的礼物，
      但请收下我唯一确知能献给你的珍宝——
      我将Brio献予你。

      我爱你，此生不渝，直至永恒~
      - Minmoose