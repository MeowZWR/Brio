  - name: 来自开发者的消息
    tagline:
    date: "2026年7月7日"
    isCurrent: true
    message: |
        为制作这个版本投入了大量心血，希望大家喜欢！
        我现在要去休息了，好困……

        更新日志太长，没能好好地感谢每一个人，
        感谢所有帮助这个版本成为可能的人们：
        Abyeon、universalconquistador、Ny、Karou、Leyla、BlueSkia
        Haselnussbomber（感谢 Hasel！）、Tex Nevada 和 SolarisFFXIV。

        特别想感谢一位开发者 Khayle，
        她开发了 Chat Bubbles 和 XIVCombo 等插件，目前需要一些经济上的帮助，
        如果可以的话，请伸出援手 (https://ko-fi.com/khayle)

        谢谢，祝您姿势摆得开心！（现在还能做动画了！！）

        一如既往，我非常爱你们，
        Minmoose  

