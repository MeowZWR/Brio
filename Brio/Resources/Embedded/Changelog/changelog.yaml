  - name: 来自开发者的消息
    tagline:
    date: "2025年10月8日"
    message: |
      新增/修改了超过13,000行代码，3个主要新功能，大量较小的功能和改进
      众多系统重写；Brio 0.6.0是自0.2.0以来最大的更新！

      我由衷感谢过去一个半月支持我的每一个人，
      大家给予我的支持、鼓励和善意令我深受感动，亦深感荣幸，
      这一切对我而言意义非凡。

      我还要向所有为我或为我母亲筹款项目捐款的朋友们，致以最诚挚的谢意。
      如果您希望被列入Brio的支持者名单，请携带捐款凭证与我联系。
      你们的支持对我而言意义重大，任何言语都无法表达我内心的感激。

      Brio的未来十分光明。我已有大量关于功能优化与版本迭代的构想，正稳步迈向1.0里程碑。
      目前项目幕后工作充满活力，加之Brio现已整合了大量Mare元素，接下来将有一系列有趣的新功能登场！

      以下是Brio即将推出的功能的不完整列表/预告，按任意顺序排列

      - 改进Brio叠加层
      - 为灯光添加更多功能
      - 为MCDF添加更多功能（这个有很多可能性！）
      - 添加Ktisis的环境功能
      - 多角色选择
      - 多骨骼选择
      - 完成项目系统
      - 为动态面部控制添加更多功能
      - 更多易用性和人性化设计

      以及两个我已经工作一段时间的秘密功能

      一如既往，如果您有任何建议、请求或发现任何错误，请在Discord或GitHub上告诉我！

      此外，Brio 社区 Discord 服务器现已开放，欢迎加入我们！discord.gg/GCb4srgEaH

      爱你们！谢谢大家！
      - Minmoose  
    
