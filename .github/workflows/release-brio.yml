name: Release Brio

on:
  push:
    tags:
      - '*-cn'
      - '!testing_*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive
        
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Restore Dependencies
      run: dotnet restore Brio.slnx

    - name: Build Brio
      run: |
        $ver = '${{ github.ref_name }}' -replace '-cn$', ''
        dotnet build --no-restore Brio.slnx --configuration Release --nologo -p:Version=$ver

    - name: Debug Build Output
      run: |
        Write-Host "Checking build output directories:"
        Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -eq "Release" } | ForEach-Object { Write-Host $_.FullName }
        Write-Host "Checking Brio directory structure:"
        if (Test-Path "Brio/bin") {
          Get-ChildItem "Brio/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host "Brio/bin directory does not exist"
        }

    - name: Archive
      run: |
        $buildPath = "Brio/bin/x64/Release"
        if (Test-Path $buildPath) {
          Write-Host "Found build output at: $buildPath"
          Compress-Archive -Path "$buildPath/*" -DestinationPath "Brio.zip" -Force
          Write-Host "Archive created successfully"
        } else {
          Write-Host "Build path not found: $buildPath"
          Write-Host "Available directories:"
          Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -eq "Release" } | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }
        
    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "./Brio.zip"
        name: Brio ${{ github.ref_name }}
        tag: ${{ github.ref_name }}
        draft: false
        token: ${{ secrets.GITHUB_TOKEN }}
        commit: ${{ vars.GITHUB_SHA }}     

    - name: Write out repo.json
      run: |
        $ver = '${{ github.ref_name }}'
        $verBase = $ver -replace '-cn$', ''
        $path = './repo.json'
        $json = Get-Content -Raw $path | ConvertFrom-Json
        $json[0].AssemblyVersion = $verBase
        $json[0].TestingAssemblyVersion = $verBase
        $json[0].DownloadLinkInstall = $json[0].DownloadLinkInstall -replace '[^/]+/Brio.zip',"$ver/Brio.zip"
        $json[0].DownloadLinkTesting = $json[0].DownloadLinkTesting -replace '[^/]+/Brio.zip',"$ver/Brio.zip"
        $json[0].DownloadLinkUpdate = $json[0].DownloadLinkUpdate -replace '[^/]+/Brio.zip',"$ver/Brio.zip"
        $content = $json | ConvertTo-Json -AsArray
        set-content -Path $path -Value $content

    - name: Commit repo.json
      run: |
        git config --global user.name "Actions User"
        git config --global user.email "actions@github.com"
        git fetch origin cn
        git branch -f cn ${{ github.sha }}
        git checkout cn
        git add repo.json
        git commit -m "[CI] Updating repo.json for ${{ github.ref_name }}" || true
        git push origin cn

  trigger_workflow:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Workflow in DalamudPlugin Repository
        run: |
          repo_owner="MeowZWR"
          repo_name="DalamudPlugin"
          event_type="request-update-run-action"
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MEOWRSTRIGGER }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"unit\": false, \"integration\": true}}"
