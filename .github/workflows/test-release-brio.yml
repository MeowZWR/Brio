name: Create Test Release

on:
  push:
    tags:
      - 'testing_*-cn'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore Dependencies
        run: dotnet restore Brio.slnx

      - name: Build Brio
        run: |
          $ver = '${{ github.ref_name }}' -replace '^testing_' -replace '-cn$'
          dotnet build --no-restore Brio.slnx --configuration Debug --nologo -p:Version=$ver

      - name: Debug Build Output
        run: |
          Write-Host "Checking build output directories:"
          Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -eq "Debug" } | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Checking Brio directory structure:"
          if (Test-Path "Brio/bin") {
            Get-ChildItem "Brio/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "Brio/bin directory does not exist"
          }

      - name: Archive
        run: |
          $buildPath = "Brio/bin/x64/Debug"
          if (Test-Path $buildPath) {
            Write-Host "Found build output at: $buildPath"
            Compress-Archive -Path "$buildPath/*" -DestinationPath "Brio.zip" -Force
            Write-Host "Archive created successfully"
          } else {
            Write-Host "Build path not found: $buildPath"
            Write-Host "Available directories:"
            Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -eq "Debug" } | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./Brio.zip

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Brio ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Brio.zip
          asset_name: Brio.zip
          asset_content_type: application/zip

      - name: Write out repo.json
        run: |
          $verT = '${{ github.ref_name }}'
          $ver = $verT -replace '^testing_' -replace '-cn$'
          $path = './repo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json[0].TestingAssemblyVersion = $ver          
          $json[0].DownloadLinkTesting = $json[0].DownloadLinkTesting -replace '[^/]+/Brio.zip',"$verT/Brio.zip"
          $content = $json | ConvertTo-Json -AsArray
          set-content -Path $path -Value $content

      - name: Commit repo.json
        run: |
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin cn
          git branch -f cn ${{ github.sha }}
          git checkout cn
          git add repo.json
          git commit -m "[CI] Updating repo.json for ${{ github.ref_name }}" || true
          git push origin cn

  trigger_workflow:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Workflow in DalamudPlugin Repository
        run: |
          repo_owner="MeowZWR"
          repo_name="DalamudPlugin"
          event_type="request-update-run-action"
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MEOWRSTRIGGER }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"unit\": false, \"integration\": true}}" 